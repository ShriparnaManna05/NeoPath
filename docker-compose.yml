version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: neopath-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: neopath_root_password
      MYSQL_DATABASE: neopath_career_counselling
      MYSQL_USER: neopath_user
      MYSQL_PASSWORD: neopath_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - neopath-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: neopath-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: neopath_career_counselling
      DB_USER: neopath_user
      DB_PASSWORD: neopath_password
      JWT_SECRET: your-super-secret-jwt-key-here
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    networks:
      - neopath-network
    volumes:
      - ./server:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: neopath-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - neopath-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: neopath-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - neopath-network

volumes:
  mysql_data:

networks:
  neopath-network:
    driver: bridge
